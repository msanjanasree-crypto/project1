  <h1>Ajith</h1>

<hr>
<p>Ajith Kumar (born May 1, 1971) is a massive superstar in Tamil cinema. Affectionately known as "Thala" or simply "AK", he has starred in over 60 films and is celebrated for his stylish screen presence, action-packed roles, and dedication to doing his own stunts
